---
- name: "UniFi Controller Einzelregistrierung"
  hosts: proxmox
  gather_facts: yes
  vars_files:
    - ../group_vars/all/vault.yml
    - ../group_vars/all/unify.yml
 
  vars:
    # Mock Container-Variablen für den UniFi-Task
    container_hostname: "{{ target_hostname | default('test-device') }}"
    container_id: "{{ target_id | default('999') }}"
    container_mac_result:
      stdout: "{{ target_mac | default('') }}"

  pre_tasks:
    - name: "Validiere Parameter"
      fail:
        msg: |
          Parameter fehlen!

          Verwendung:
          ansible-playbook playbooks/unifi-register.yml --ask-vault-pass \
            -e "target_hostname=mein-geraet" \
            -e "target_mac=aa:bb:cc:dd:ee:ff"

          Optional:
          -e "target_id=123"
      when:
        - target_hostname is not defined or target_hostname == ""
        - target_mac is not defined or target_mac == ""

    - name: "Zeige Registrierungs-Info"
      debug:
        msg: |
          ==========================================================================
          UNIFI REGISTRIERUNG
          ==========================================================================
          Hostname: {{ container_hostname }}
          MAC-Adresse: {{ container_mac_result.stdout }}
          {% if target_id is defined %}
          ID: {{ target_id }}
          {% endif %}
          ==========================================================================

  tasks:
    - name: "UniFi-Registrierung ausführen"
      include_tasks: ../roles/proxmox_lxc/tasks/unify_manual.yml
      tags: [unifi_register]
